services: 
  db: 
    image: postgres:16
    container_name: seatlock-db
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: 
      - "5432:5432"
    volumes: 
      - seatlock-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d seatlock"]
      interval: 5s
      timeout: 3s
      retries: 5
  
volumes:
  seatlock-db-data: